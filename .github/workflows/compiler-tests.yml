---
# This workflow runs all of the compiler tests

name: Compiler Tests

on:
    push:
        branches: [xs-dev]
    pull_request:
        branches: [xs-dev]

jobs:
    # replication of compiler-tests.sh
    all-compilers:
        strategy:
            fail-fast: false
            matrix:
                image:
                    [
                        gcc-version-14,
                        gcc-version-13,
                        gcc-version-12,
                        gcc-version-11,
                        gcc-version-10,
                        clang-version-18,
                        clang-version-17,
                        clang-version-16,
                        clang-version-15,
                        clang-version-14,
                        ubuntu-22.04_all-dependencies,
                        ubuntu-24.04_all-dependencies,
                        ubuntu-24.04_min-dependencies,
                    ]
                opts: [.opt, .fast, .debug]
        runs-on: ubuntu-latest
        timeout-minutes: 2880 # 48 hours
        container: ghcr.io/gem5/${{ matrix.image }}:latest
        steps:
            - uses: actions/checkout@v4
            - name: Compile build/RISCV/gem5${{ matrix.opts }} with ${{ matrix.image }}
              run: /usr/bin/env python3 /usr/bin/scons --ignore-style build/RISCV/gem5${{ matrix.opts }} -j$(nproc)
              timeout-minutes: 600 # 10 hours

    compiler-tests:
        # The dummy job is used to indicate whether the compiler tests have
        # passed or not. This can be used as status check for pull requests.
        # I.e., if we want to stop pull requests from being merged if the
        # compiler tests are failing, we can add this job as a required status
        # check.
        runs-on: ubuntu-latest
        needs:
            - all-compilers
        steps:
            - run: echo "This compiler tests have passed."
