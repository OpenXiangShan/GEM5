name: On-Demand RVV SPEC Test (Tier 1.5)

on:
  # Label触发: 添加 'rvv' 标签自动跑 spec06int-rvv-0.8c
  push:
    branches: [ xs-dev ]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  run_rvv_spec_test:
    name: Run RVV SPEC Test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/xs-dev') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'rvv' &&
       github.event.pull_request.base.ref == 'xs-dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: configs/example/idealkmhv3.py
      benchmark_type: spec06int-rvv-0.8c
      pr_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
