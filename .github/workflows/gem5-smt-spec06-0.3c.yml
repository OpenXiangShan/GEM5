name: gem5 SMT SPEC2006 Performance Test(0.3c)

on:
  push:
    branches: [ xs-dev, '*-smt' ]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  perf_test:
    if: |
      github.event_name != 'pull_request_target' ||
      (github.event.label.name == 'perf-smt' &&
       github.event.pull_request.base.ref == 'xs-dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: configs/example/smt_idealkmhv3.py
      extra_args: "--dramsim3-ini=ext/dramsim3/xiangshan_configs/xiangshan_DDR4_8Gb_x8_3200_2ch.ini"
      benchmark_type: "gcc12-spec06-smt-0.3c"
      pr_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
