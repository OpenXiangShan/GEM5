name: gem5 Full Test (Tier 2 - Post-Merge)

on:
  push:
    branches: [ xs-dev ]
  # Removed pull_request trigger - moved to pr-quick-check.yml (Tier 1)
  # can be triggered manually
  workflow_dispatch:

jobs:
  paralel_cpt_test:
    # gem5.cfg 使用的切片 ck_path 位于小机房
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Running test checkpoints
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64

      - name: Run paralel autotest script
        shell: bash
        run: |
          python3 .github/workflows/autotest/script/autotest.py \
            -f .github/workflows/autotest/gem5.cfg

  paralel_cpt_h_test:
    # H/V checkpoint 测试
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Running h test checkpoints
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64

      - name: Prepare H NEMU reference
        shell: bash
        run: |
          set -euo pipefail

          SHARED_REF="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-h-so"
          HOME_REF="/nfs/home/yangxianhui/workspace/NEMU/build/riscv64-nemu-interpreter-so"
          OLD_REF="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-notama-tvalref-so"

          LOCAL_REF_DIR="$GITHUB_WORKSPACE/.ci-ref"
          LOCAL_REF="$LOCAL_REF_DIR/riscv64-nemu-interpreter-h-so"

          EXPECTED_SHA256="6f9c40f0bcf9b61bb8feccaa3a1216b67d29daf3dfd713f551cb174dea56df14"

          echo "===== runner information ====="
          echo "hostname: $(hostname)"
          hostname -f || true
          echo "pwd: $(pwd)"
          id

          echo "===== NFS mount information ====="
          findmnt -T /nfs/home/share/gem5_ci/ref/normal || true
          findmnt -T /nfs/home/yangxianhui || true
          df -hT /nfs/home/share/gem5_ci/ref/normal || true
          df -hT /nfs/home/yangxianhui || true

          echo "===== reference directory ====="
          ls -ld \
            /nfs \
            /nfs/home \
            /nfs/home/share \
            /nfs/home/share/gem5_ci \
            /nfs/home/share/gem5_ci/ref \
            /nfs/home/share/gem5_ci/ref/normal \
            2>/dev/null || true

          echo "===== NEMU files visible in shared directory ====="
          ls -lh /nfs/home/share/gem5_ci/ref/normal 2>/dev/null |
            grep -i nemu || true

          echo "===== candidate references ====="
          for candidate in "$SHARED_REF" "$HOME_REF" "$OLD_REF"; do
            echo
            echo "--- $candidate ---"

            if [[ -e "$candidate" ]]; then
              ls -lh "$candidate"
              file "$candidate" || true
              sha256sum "$candidate" || true
            else
              echo "NOT FOUND"
            fi
          done

          if [[ -r "$SHARED_REF" ]]; then
            SOURCE_REF="$SHARED_REF"
            echo "Using shared H reference"
          elif [[ -r "$HOME_REF" ]]; then
            SOURCE_REF="$HOME_REF"
            echo "Shared H reference unavailable; using NFS home build"
          else
            echo "ERROR: neither candidate H reference is readable"
            exit 1
          fi

          mkdir -p "$LOCAL_REF_DIR"
          install -m 0644 "$SOURCE_REF" "$LOCAL_REF"

          echo "===== runner-local H reference ====="
          ls -lh "$LOCAL_REF"
          file "$LOCAL_REF"

          ACTUAL_SHA256="$(sha256sum "$LOCAL_REF" | awk '{print $1}')"

          echo "expected SHA256: $EXPECTED_SHA256"
          echo "actual SHA256:   $ACTUAL_SHA256"

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "ERROR: unexpected H NEMU reference contents"
            exit 1
          fi

          echo "===== dynamic dependencies ====="
          if ldd "$LOCAL_REF" | grep -i "not found"; then
            echo "ERROR: missing dynamic library"
            exit 1
          fi

          echo "===== Difftest symbols ====="
          nm -D "$LOCAL_REF" |
            grep -E 'difftest_(init|exec|regcpy)' |
            head -30

          echo "===== patch gem5-h.cfg for this runner ====="
          sed -i \
            -e "s#$SHARED_REF#$LOCAL_REF#g" \
            -e "s#$OLD_REF#$LOCAL_REF#g" \
            .github/workflows/autotest/gem5-h.cfg

          grep -n -B2 -A3 \
            'GCBH_REF_SO\|GCBV_REF_SO' \
            .github/workflows/autotest/gem5-h.cfg

          grep -q "$LOCAL_REF" \
            .github/workflows/autotest/gem5-h.cfg

      - name: Run paralel h autotest script
        shell: bash
        run: |
          python3 .github/workflows/autotest/script/autotest.py \
            -f .github/workflows/autotest/gem5-h.cfg

      - name: Dump H failure details
        if: ${{ failure() }}
        shell: bash
        run: |
          set -uo pipefail

          dump_case() {
            local case_dir="$1"

            echo
            echo "=================================================="
            echo "CASE DIRECTORY: $case_dir"
            echo "=================================================="

            if [[ ! -d "$case_dir" ]]; then
              echo "Directory does not exist: $case_dir"
              return 0
            fi

            while IFS= read -r -d '' file; do
              echo
              echo "--------------------------------------------------"
              echo "FILE: $file"
              echo "--------------------------------------------------"
              tail -n 500 "$file" || true
            done < <(
              find "$case_dir" \
                -type f \
                \( \
                  -name 'taskerr.txt' -o \
                  -name 'taskout.txt' -o \
                  -name 'other.txt' -o \
                  -name 'gem5.log' -o \
                  -name 'launcher.log' -o \
                  -name 'simerr' -o \
                  -name 'simout' -o \
                  -name 'stdout' -o \
                  -name 'stderr' \
                \) \
                -print0 2>/dev/null
            )
          }

          dump_case \
            "./log_root_h/rungem5/checkpoint-0-0-0/astar_biglakes"

          dump_case \
            "./log_root_h/rungem5/checkpoint-0-0-0/wrf"

          echo
          echo "=================================================="
          echo "FIRST IMPORTANT ERRORS ACROSS ALL H TESTS"
          echo "=================================================="

          grep -RniE \
            'fatal|panic|difftest|mismatch|assert|segmentation|undefined symbol|dlopen|cannot open shared object|failed to open|no such file|error' \
            ./log_root_h/rungem5 \
            2>/dev/null |
            head -n 1000 || true

  valgrind_memory_check:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Check memory corruption
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 debug
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.debug --linker=gold -j64
      - name: Memory check
        run: |
          export GEM5_HOME=$(pwd)
          bash util/memory_check/run-xs-with-valgrind.sh
          cd $GEM5_HOME


  new_sim_script_test_gcbv:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test new simulation script on RV64GCBV
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64 --rvv-impl=simple
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-so"
          export GCBV_RESTORER="/nfs/home/share/gem5_ci/tools/gcbv-restorer.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_v
          cd $GEM5_HOME/util/xs_scripts/test_v
          bash ../kmh_6wide_vector.sh /nfs/home/share/gem5_ci/checkpoints/gcbv_test.zstd

  new_sim_script_test_gcb_multi_core:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test Multi-core + RV64GCB
    steps:
      - uses: actions/checkout@v7
      - name: Build GEM5 opt
        run: |
          CC=clang CXX=clang++ scons build/RISCV_CHI/gem5.opt -j 48 --gold-linker
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_MULTI_CORE_REF_SO="/nfs/home/share/gem5_ci/ref/multi/riscv64-nemu-interpreter-so"
          export GCB_MULTI_CORE_RESTORER="/nfs/home/share/gem5_ci/tools/gcb-2core-restorer.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_multi_core
          cd $GEM5_HOME/util/xs_scripts/test_multi_core
          bash ../kmh-ruby-dual.sh /nfs/home/share/gem5_ci/checkpoints/multi_core_test.gz


  test_fix_l2tlb_bugs:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test fix L2TLB bugs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-so"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_l2tlb
          cd $GEM5_HOME/util/xs_scripts/test_l2tlb
          bash ../kmh_6wide.sh /nfs/home/share/gem5_ci/checkpoints/l2tlb_test.zstd

  new_sim_script_test_gcbh:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test new simulation script on RV64GCBH
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBH_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-notama-tvalref-so"
          export GCBH_RESTORER="/nfs/home/share/gem5_ci/tools/gcpt.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_h
          cd $GEM5_HOME/util/xs_scripts/test_h
          bash ../kmh_6wide_h.sh /nfs/home/share/gem5_ci/checkpoints/gcbh_test.zstd

  raw_linux_boot_test:
    runs-on: [self-hosted, open]
    continue-on-error: false
    timeout-minutes: 30
    name: XS-GEM5 - Boot raw Linux
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: Boot Xiangshan raw Linux
        run: |
          export RAW_LINUX_BIN="${XS_LINUX_BIN:-/nfs/home/share/gem5_ci/ready-to-run/linux.bin}"
          if [ ! -r "$RAW_LINUX_BIN" ]; then
            echo "Missing raw linux image: $RAW_LINUX_BIN"
            echo "Please provision the image at the default path or set XS_LINUX_BIN on the runner."
            exit 1
          fi

          mkdir -p debug/raw_linux_ci
          ./build/RISCV/gem5.opt -r -d debug/raw_linux_ci \
            ./configs/example/kmhv3.py \
            --raw-cpt \
            --generic-rv-cpt "$RAW_LINUX_BIN" \
            --disable-difftest
      - name: Check boot result
        run: |
          test -f debug/raw_linux_ci/simout
          tail -n 200 debug/raw_linux_ci/simout
          grep -q "Hello, XiangShan!" debug/raw_linux_ci/simout
          grep -q "m5_exit instruction encountered" debug/raw_linux_ci/simout
