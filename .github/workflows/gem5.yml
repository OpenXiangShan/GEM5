name: gem5 Full Test (Tier 2 - Post-Merge)

on:
  push:
    branches: [ xs-dev ]
  # Removed pull_request trigger - moved to pr-quick-check.yml (Tier 1)
  # can be triggered manually
  workflow_dispatch:

jobs:
  paralel_cpt_test:
    # gem5.cfg 使用的切片 ck_path 位于小机房
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Running test checkpoints
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64

      - name: Run paralel autotest script
        shell: bash
        run: |
          python3 .github/workflows/autotest/script/autotest.py \
            -f .github/workflows/autotest/gem5.cfg

  paralel_cpt_h_test:
    # 在 open runner 上构建并发布 H/V NEMU reference，然后运行 H checkpoint
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Running h test checkpoints
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64

      - name: Build and publish H NEMU reference
        shell: bash
        run: |
          set -euo pipefail

          NEMU_COMMIT="3a217a17a96ff3782b16ec8886f499dd5814ebbd"
          NEMU_DIR="$RUNNER_TEMP/NEMU-h-reference"

          REF_DIR="/nfs/home/share/gem5_ci/ref/normal"
          REF="$REF_DIR/riscv64-nemu-interpreter-h-so"

          echo "===== runner information ====="
          hostname
          id
          findmnt -T "$REF_DIR" || true
          ls -ld "$REF_DIR"

          echo "===== clone NEMU ====="
          rm -rf "$NEMU_DIR"

          git clone \
            https://github.com/OpenXiangShan/NEMU.git \
            "$NEMU_DIR"

          git -C "$NEMU_DIR" checkout "$NEMU_COMMIT"
          git -C "$NEMU_DIR" submodule update --init --recursive

          cd "$NEMU_DIR"
          export NEMU_HOME="$NEMU_DIR"

          echo "===== generate config ====="
          make riscv64-gem5-ref_defconfig

          # 保证需要打开的配置存在且为 y
          set_config_y() {
            local option="$1"

            sed -i \
              -e "/^CONFIG_${option}=y$/d" \
              -e "/^# CONFIG_${option} is not set$/d" \
              .config

            printf 'CONFIG_%s=y\n' "$option" >> .config
          }

          # 保证需要关闭的配置为 not set
          set_config_n() {
            local option="$1"

            sed -i \
              -e "/^CONFIG_${option}=y$/d" \
              -e "/^# CONFIG_${option} is not set$/d" \
              .config

            printf '# CONFIG_%s is not set\n' "$option" >> .config
          }

          set_config_y RVH
          set_config_y RVV
          set_config_y GUIDED_EXEC
          set_config_y GUIDED_TVAL
          set_config_y TVAL_EX_II

          set_config_n RV_SSTC
          set_config_n RVV_AGNOSTIC

          echo "===== requested NEMU config ====="
          grep -E \
            'CONFIG_RVH=|CONFIG_RVV=|CONFIG_RV_SSTC|CONFIG_RVV_AGNOSTIC|CONFIG_GUIDED_EXEC|CONFIG_GUIDED_TVAL|CONFIG_TVAL_EX_II|CONFIG_SHARE=|CONFIG_SHARE_REF=|CONFIG_DIFFTEST_REF_FOR_GEM5=' \
            .config

          grep -qx 'CONFIG_RVH=y' .config
          grep -qx 'CONFIG_RVV=y' .config
          grep -qx 'CONFIG_GUIDED_EXEC=y' .config
          grep -qx 'CONFIG_GUIDED_TVAL=y' .config
          grep -qx 'CONFIG_TVAL_EX_II=y' .config
          grep -qx '# CONFIG_RV_SSTC is not set' .config
          grep -qx '# CONFIG_RVV_AGNOSTIC is not set' .config
          grep -qx 'CONFIG_SHARE=y' .config
          grep -qx 'CONFIG_SHARE_REF=y' .config
          grep -qx 'CONFIG_DIFFTEST_REF_FOR_GEM5=y' .config

          echo "===== build NEMU ====="
          JOBS="$(nproc)"
          if [[ "$JOBS" -gt 100 ]]; then
            JOBS=100
          fi

          rm -rf build
          make -j"$JOBS"

          SRC="$NEMU_DIR/build/riscv64-nemu-interpreter-so"

          test -r "$SRC"

          echo "===== built NEMU reference ====="
          ls -lh "$SRC"
          file "$SRC"
          sha256sum "$SRC"

          echo "===== publish to open-runner share ====="
          WRITE_TEST="$REF_DIR/.h-ref-write-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          touch "$WRITE_TEST"
          rm -f "$WRITE_TEST"

          TMP_REF="$REF_DIR/.riscv64-nemu-interpreter-h-so.${GITHUB_RUN_ID}.tmp"

          install -m 0755 "$SRC" "$TMP_REF"
          mv -f "$TMP_REF" "$REF"

          install -m 0644 \
            "$NEMU_DIR/.config" \
            "${REF}.config"

          git -C "$NEMU_DIR" rev-parse HEAD \
            > "${REF}.commit"

          sha256sum "$REF" \
            > "${REF}.sha256"

          echo "===== published H reference ====="
          ls -lh "$REF"
          file "$REF"
          sha256sum "$SRC" "$REF"

          echo "===== recorded commit ====="
          cat "${REF}.commit"

          echo "===== recorded config ====="
          grep -E \
            'CONFIG_RVH=|CONFIG_RVV=|CONFIG_RV_SSTC|CONFIG_RVV_AGNOSTIC|CONFIG_GUIDED_EXEC|CONFIG_GUIDED_TVAL|CONFIG_TVAL_EX_II' \
            "${REF}.config"

          echo "===== dependency check ====="
          if ldd "$REF" | grep -i 'not found'; then
            echo "ERROR: missing dynamic dependency"
            exit 1
          fi

          echo "===== Difftest symbols ====="
          nm -D "$REF" |
            grep -E 'difftest_(init|exec|regcpy)' |
            head -30

          echo "===== patch this runner's gem5-h.cfg ====="
          cd "$GITHUB_WORKSPACE"

          python3 - "$REF" <<'PYCFG'
          import re
          import sys
          from pathlib import Path

          reference = sys.argv[1]
          path = Path(".github/workflows/autotest/gem5-h.cfg")
          text = path.read_text(encoding="utf-8")

          text, h_count = re.subn(
              r'export GCBH_REF_SO="[^"]+"',
              f'export GCBH_REF_SO="{reference}"',
              text,
          )

          text, v_count = re.subn(
              r'export GCBV_REF_SO="[^"]+"',
              f'export GCBV_REF_SO="{reference}"',
              text,
          )

          if h_count != 1 or v_count != 1:
              raise SystemExit(
                  f"Unexpected ref counts: H={h_count}, V={v_count}"
              )

          path.write_text(text, encoding="utf-8")
          PYCFG

          grep -n -B2 -A3 \
            'GCBH_REF_SO\|GCBV_REF_SO' \
            .github/workflows/autotest/gem5-h.cfg

      - name: Run paralel h autotest script
        shell: bash
        run: |
          python3 .github/workflows/autotest/script/autotest.py \
            -f .github/workflows/autotest/gem5-h.cfg

      - name: Dump H failure details
        if: ${{ failure() }}
        shell: bash
        run: |
          set -uo pipefail

          for case_dir in \
            "./log_root_h/rungem5/checkpoint-0-0-0/astar_biglakes" \
            "./log_root_h/rungem5/checkpoint-0-0-0/wrf"
          do
            echo
            echo "=================================================="
            echo "CASE: $case_dir"
            echo "=================================================="

            if [[ ! -d "$case_dir" ]]; then
              echo "Directory not found"
              continue
            fi

            find "$case_dir" \
              -type f \
              \( \
                -name 'taskerr.txt' -o \
                -name 'taskout.txt' -o \
                -name 'other.txt' -o \
                -name 'gem5.log' -o \
                -name 'simerr' -o \
                -name 'simout' \
              \) \
              -print \
              -exec sh -c '
                echo "---------- $1 ----------"
                tail -n 500 "$1" || true
              ' sh {} \;
          done

          echo "===== important errors across H tests ====="

          grep -RniE \
            'fatal|panic|difftest|mismatch|assert|segmentation|undefined symbol|dlopen|cannot open shared object|error' \
            ./log_root_h/rungem5 \
            2>/dev/null |
            head -1000 || true

  valgrind_memory_check:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Check memory corruption
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 debug
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.debug --linker=gold -j64
      - name: Memory check
        run: |
          export GEM5_HOME=$(pwd)
          bash util/memory_check/run-xs-with-valgrind.sh
          cd $GEM5_HOME


  new_sim_script_test_gcbv:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test new simulation script on RV64GCBV
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64 --rvv-impl=simple
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-so"
          export GCBV_RESTORER="/nfs/home/share/gem5_ci/tools/gcbv-restorer.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_v
          cd $GEM5_HOME/util/xs_scripts/test_v
          bash ../kmh_6wide_vector.sh /nfs/home/share/gem5_ci/checkpoints/gcbv_test.zstd

  new_sim_script_test_gcb_multi_core:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test Multi-core + RV64GCB
    steps:
      - uses: actions/checkout@v7
      - name: Build GEM5 opt
        run: |
          CC=clang CXX=clang++ scons build/RISCV_CHI/gem5.opt -j 48 --gold-linker
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_MULTI_CORE_REF_SO="/nfs/home/share/gem5_ci/ref/multi/riscv64-nemu-interpreter-so"
          export GCB_MULTI_CORE_RESTORER="/nfs/home/share/gem5_ci/tools/gcb-2core-restorer.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_multi_core
          cd $GEM5_HOME/util/xs_scripts/test_multi_core
          bash ../kmh-ruby-dual.sh /nfs/home/share/gem5_ci/checkpoints/multi_core_test.gz


  test_fix_l2tlb_bugs:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test fix L2TLB bugs
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-so"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_l2tlb
          cd $GEM5_HOME/util/xs_scripts/test_l2tlb
          bash ../kmh_6wide.sh /nfs/home/share/gem5_ci/checkpoints/l2tlb_test.zstd

  new_sim_script_test_gcbh:
    runs-on: [self-hosted, open]
    continue-on-error: false
    name: XS-GEM5 - Test new simulation script on RV64GCBH
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: XS-GEM5 - Test xiangshan.py simulation scripts
        run: |
          export GCBH_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-notama-tvalref-so"
          export GCBH_RESTORER="/nfs/home/share/gem5_ci/tools/gcpt.bin"
          export GEM5_HOME=$(pwd)
          mkdir -p $GEM5_HOME/util/xs_scripts/test_h
          cd $GEM5_HOME/util/xs_scripts/test_h
          bash ../kmh_6wide_h.sh /nfs/home/share/gem5_ci/checkpoints/gcbh_test.zstd

  raw_linux_boot_test:
    runs-on: [self-hosted, open]
    continue-on-error: false
    timeout-minutes: 30
    name: XS-GEM5 - Boot raw Linux
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - name: Boot Xiangshan raw Linux
        run: |
          export RAW_LINUX_BIN="${XS_LINUX_BIN:-/nfs/home/share/gem5_ci/ready-to-run/linux.bin}"
          if [ ! -r "$RAW_LINUX_BIN" ]; then
            echo "Missing raw linux image: $RAW_LINUX_BIN"
            echo "Please provision the image at the default path or set XS_LINUX_BIN on the runner."
            exit 1
          fi

          mkdir -p debug/raw_linux_ci
          ./build/RISCV/gem5.opt -r -d debug/raw_linux_ci \
            ./configs/example/kmhv3.py \
            --raw-cpt \
            --generic-rv-cpt "$RAW_LINUX_BIN" \
            --disable-difftest
      - name: Check boot result
        run: |
          test -f debug/raw_linux_ci/simout
          tail -n 200 debug/raw_linux_ci/simout
          grep -q "Hello, XiangShan!" debug/raw_linux_ci/simout
          grep -q "m5_exit instruction encountered" debug/raw_linux_ci/simout
