name: gem5 Align BTB Performance Test(0.3c)

on:
  push:
    branches: [ xs-dev, '*-align' ]  # xs-dev for normal CI, *-align for BTB-only performance testing (align to RTL)
  # Label-triggered PR align performance testing
  pull_request_target:
    types: [labeled]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Align performance runs are exploratory and share a finite self-hosted node
# pool.  Keep only the newest run for a branch/PR so stale pushes cannot
# multiply the 145-checkpoint workload and trigger the six-hour timeout.
concurrency:
  group: gem5-align-btb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perf_test:
    if: |
      github.event_name != 'pull_request_target' ||
      (github.event.label.name == 'perf-align' &&
       github.event.pull_request.base.ref == 'xs-dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: configs/example/kmhv3.py
      benchmark_type: "spec06-rva23-novec-gcc16-0.3c"
      pr_sha: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
