name: PR Quick Check (Tier 1)

on:
  pull_request:
    branches: [ xs-dev ]

permissions:
  pull-requests: write
  contents: read

jobs:
  quick_check:
    runs-on: [self-hosted, node]
    continue-on-error: false
    name: Quick Build, Unit Tests & Smoke Test
    steps:
      - uses: actions/checkout@v2
      
      - name: Build DRAMSim (cached)
        run: |
          cd ext/dramsim3
          # 使用本地缓存避免网络IO
          if [ ! -d "DRAMsim3" ]; then
            cp -r /nfs/home/share/gem5_ci/DRAMsim3 .
          fi
          cd DRAMsim3 && mkdir -p build && cd build
          cmake .. && make -j 48
      
      - name: Build GEM5 opt
        run: |
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      
      - name: Run unit tests
        run: |
          CC=gcc CXX=g++ scons build/RISCV/unittests.opt -j100 --unit-test

      - name: Difftest smoke test
        run: |
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/error/riscv64-nemu-interpreter-so"
          export GCB_RESTORER="/nfs/home/share/gem5_ci/tools/normal-gcb-restorer.bin"
          export GEM5_HOME=$(pwd)
          
          ./build/RISCV/gem5.opt ./configs/example/idealkmhv3.py --raw-cpt --generic-rv-cpt=/nfs/home/share/gem5_ci/checkpoints/coremark-riscv64-xs.bin || exit_code=$?
          
          # 验证 difftest 应该报错
          if [ ${exit_code} -eq 0 ]; then 
            echo "❌ Difftest is broken, it should report error!"
            exit 1
          fi
          
          # 提取 IPC
          IPC=$(grep "cpu.ipc" ./m5out/stats.txt | awk '{print $2}')
          echo "Coremark IPC: ${IPC}"
          
          # 写入 GitHub summary
          echo "## 🚀 Coremark Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coremark IPC:** \`${IPC}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Difftest smoke test passed!" >> $GITHUB_STEP_SUMMARY
          
          # 保存 IPC 供下一步使用
          echo "${IPC}" > /tmp/coremark_ipc.txt
      
      - name: Comment IPC to PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const ipc = fs.readFileSync('/tmp/coremark_ipc.txt', 'utf8').trim();
            
            const comment = `## 🚀 Coremark Smoke Test Results\n\n**Coremark IPC:** \`${ipc}\`\n\n✅ Difftest smoke test passed!`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

