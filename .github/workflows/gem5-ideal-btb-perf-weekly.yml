name: gem5 Weekly Performance Test

on:
  schedule:
    # Run every Thursday at 21:17 UTC+8 (13:17 UTC)
    - cron: '17 13 * * 4'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated job IDs (no spaces); leave empty to run all jobs'
        required: false
        type: string
        default: ''

jobs:
  rvwmo_litmus:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',rvwmo_litmus,') }}
    runs-on: [self-hosted, node]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 opt
        run: CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j64
      - uses: actions/checkout@v7
        with:
          repository: OpenXiangShan/litmus-tests-riscv
          ref: 975a9a66b9d1bc55db30adbe03a7d0ee6c8a313f
          path: litmus-tests-riscv
          sparse-checkout: platforms/xs-gem5
          persist-credentials: false
      - name: Run RVWMO litmus tests on SMT and SpMT
        env:
          PYTHONPATH: litmus-tests-riscv/platforms/xs-gem5
        run: |
          set -euo pipefail
          ulimit -c 0
          corpus=/nfs/home/share/gem5_ci/checkpoints/rvwmo-litmus/rvwmo-975a9a66
          python3 .github/scripts/weekly_rvwmo.py build/RISCV/gem5.opt "$corpus"

  align_test_spec06:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',align_test_spec06,') }}
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      timeout_minutes: 720
      config_path: configs/example/kmhv3.py
      benchmark_type: "spec06-rva23-novec-gcc16-1.0c"

  align_test_spec06_xscc:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',align_test_spec06_xscc,') }}
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      timeout_minutes: 720
      config_path: configs/example/kmhv3.py
      benchmark_type: "custom-spec06"
      checkpoint_path: "/nfs/home/share/checkpoints_profiles/spec06_xscc_rv64gcb_261013/checkpoint-0-0-0"
      extra_args: "--enable-mem-dedup --mem-size=32GB"
      gcbv_ref_so: "/nfs/home/share/gem5_ci/ref/releases/af9d4ce51fc2-gem5-r4-multi16g-zfa-cbo-sstc-single32g/normal-dedup-32g/riscv64-nemu-interpreter-so"

  align_test_spec17:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',align_test_spec17,') }}
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      timeout_minutes: 720
      config_path: configs/example/kmhv3.py
      benchmark_type: "spec17-1.0c"

  align_test_spec26:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',align_test_spec26,') }}
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: configs/example/kmhv3.py
      benchmark_type: "gcc15-spec26-1.0c"
      distributed_servers: "default"
      distributed_jobs_per_server: 32
      timeout_minutes: 720

  perf_test_spec06:
    if: ${{ !inputs.jobs || contains(format(',{0},', inputs.jobs), ',perf_test_spec06,') }}
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      timeout_minutes: 720
      config_path: configs/example/idealkmhv3.py
      benchmark_type: "spec06-rva23-novec-gcc16-1.0c"

  perf_test_spec06_xscc:
