    branches: [ xs-dev ]
  schedule:
    # Run every Thursday at 23:59 UTC+8 (15:59 UTC)
    - cron: '59 15 * * 4'
  workflow_dispatch:
    # Allow manual triggering of the workflow

jobs:
  perf_test_spec06:
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      script_path: ../kmh_v3_btb.sh
      checkpoint_list: "/nfs/home/share/gem5_ci/spec06_cpts/checkpoint-0-0-0.lst"
  
  perf_test_spec17:
    uses: ./.github/workflows/gem5-perf-template-spec17.yml
    with:
      script_path: ../kmh_v3_btb.sh 