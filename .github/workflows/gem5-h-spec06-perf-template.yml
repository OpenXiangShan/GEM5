name: H SPEC06 Performance Test Template

on:
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
      coverage_type:
        required: true
        type: string
      specific_benchmarks:
        required: false
        type: string
        default: ''
      pf_control_profile:
        required: false
        type: string
        default: 'off'
      extra_args:
        required: false
        type: string
        default: ''
      distributed_servers:
        required: false
        type: string
        default: ''
      distributed_jobs_per_server:
        required: false
        type: number
        default: 32
      pr_sha:
        required: false
        type: string
        default: ''
      timeout_minutes:
        required: false
        type: number
        default: 720

permissions:
  contents: read

jobs:
  run_h_spec06_performance:
    runs-on: [self-hosted, node]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    name: XS-GEM5 - Run ${{ inputs.coverage_type }} performance test
    steps:
      - name: Reject untrusted PR head checkout
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing to checkout an external fork PR head under pull_request_target."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 fast
        run: |
          export GEM5_HOME="$GITHUB_WORKSPACE"
          export GCBV_REF_SO="/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-notama-tvalref-so"
          bash util/pgo/basic_pgo_new.sh

      - name: Set H checkpoint coverage
        id: coverage
        env:
          COVERAGE_TYPE: ${{ inputs.coverage_type }}
        run: |
          case "$COVERAGE_TYPE" in
            h-spec06-0.5c)
              echo "checkpoint_list=util/xs_scripts/data/h_spec06_0.5c.lst" >> "$GITHUB_OUTPUT"
              echo "selection_json=util/xs_scripts/data/h_spec06_0.5c_h_profile_insts.json" >> "$GITHUB_OUTPUT"
              echo "cluster_config=util/xs_scripts/data/h_spec06_0.5c_h_profile_insts.json" >> "$GITHUB_OUTPUT"
              echo "expected_checkpoints=257" >> "$GITHUB_OUTPUT"
              echo "label=H SPEC06 0.5c" >> "$GITHUB_OUTPUT"
              echo "archive_name=h-gcc15-spec06-0.5c" >> "$GITHUB_OUTPUT"
              ;;
            h-spec06-1.0c)
              echo "checkpoint_list=util/xs_scripts/data/h_spec06_1.0c.lst" >> "$GITHUB_OUTPUT"
              echo "selection_json=util/xs_scripts/data/h_spec06_1.0c_h_profile_insts.json" >> "$GITHUB_OUTPUT"
              echo "cluster_config=util/xs_scripts/data/h_spec06_1.0c_h_profile_insts.json" >> "$GITHUB_OUTPUT"
              echo "expected_checkpoints=1089" >> "$GITHUB_OUTPUT"
              echo "label=H SPEC06 1.0c" >> "$GITHUB_OUTPUT"
              echo "archive_name=h-gcc15-spec06-1.0c" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported H SPEC06 coverage type: $COVERAGE_TYPE"
              exit 1
              ;;
          esac

      - name: Prepare H performance archive
        id: archive
        env:
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
          PF_CONTROL_PROFILE_INPUT: ${{ inputs.pf_control_profile }}
          EXTRA_ARGS_INPUT: ${{ inputs.extra_args }}
          DISTRIBUTED_SERVERS_RAW: ${{ inputs.distributed_servers }}
          DISTRIBUTED_JOBS_PER_SERVER_RAW: ${{ inputs.distributed_jobs_per_server }}
        run: |
          ARCHIVE_ROOT="/nfs/home/share/gem5_ci/performance_data/${{ steps.coverage.outputs.archive_name }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          CONFIG_NAME=$(basename "$CONFIG_PATH_INPUT" .py)
          CONFIG_NAME=$(printf '%s' "$CONFIG_NAME" | tr -c 'A-Za-z0-9._-' '_')
          TARGET_DIR="${ARCHIVE_ROOT}/${TIMESTAMP}_${COMMIT_SHORT}_${CONFIG_NAME}_run${{ github.run_number }}"
          DISTRIBUTED_SERVERS=$(echo "$DISTRIBUTED_SERVERS_RAW" | xargs)
          if [ "$DISTRIBUTED_SERVERS" = "default" ]; then
            DISTRIBUTED_SERVERS="node020-node034,node036-node039"
          fi

          mkdir -p "$TARGET_DIR"
          {
            echo "target_dir=$TARGET_DIR"
            echo "distributed_servers=$DISTRIBUTED_SERVERS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "commit: $(git rev-parse HEAD)"
            echo "config_path: $CONFIG_PATH_INPUT"
            echo "specific_benchmarks: $SPECIFIC_BENCHMARKS_INPUT"
            echo "pf_control_profile: ${PF_CONTROL_PROFILE_INPUT:-off}"
            echo "extra_args: $EXTRA_ARGS_INPUT"
            echo "distributed_servers: $DISTRIBUTED_SERVERS"
            echo "distributed_jobs_per_server: $DISTRIBUTED_JOBS_PER_SERVER_RAW"
            echo "maxinsts: 40000000"
            echo "checkpoint_set: ${{ steps.coverage.outputs.label }}"
            echo "expected_checkpoints: ${{ steps.coverage.outputs.expected_checkpoints }}"
          } > "$TARGET_DIR/metadata.txt"

          {
            echo "### Live archive output"
            echo "- Path: \`$TARGET_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record H checkpoint selection
        env:
          GEM5_HOME: ${{ github.workspace }}
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
        run: |
          SOURCE_LIST="$GEM5_HOME/${{ steps.coverage.outputs.checkpoint_list }}"
          test -r "$SOURCE_LIST"
          test "$(wc -l < "$SOURCE_LIST")" -eq "${{ steps.coverage.outputs.expected_checkpoints }}"
          cp "$SOURCE_LIST" "$PERF_ARCHIVE_DIR/checkpoint_selection.lst"

      # Keep the scoring dependency available even when one or more CPs fail.
      - name: Setup gem5_data_proc environment
        run: |
          cd "$GITHUB_WORKSPACE"
          cp -r /nfs/home/share/gem5_ci/gem5_data_proc .

      - name: Run H SPEC06 performance test
        env:
          GEM5_HOME: ${{ github.workspace }}
          GEM5_BUILD_TYPE: fast
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
          PF_CONTROL_PROFILE_INPUT: ${{ inputs.pf_control_profile }}
          EXTRA_GEM5_ARGS_RAW: ${{ inputs.extra_args }}
          DISTRIBUTED_SERVERS: ${{ steps.archive.outputs.distributed_servers }}
          DISTRIBUTED_JOBS_PER_SERVER: ${{ inputs.distributed_jobs_per_server }}
          GCBH_REF_SO: /nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-v2026.07.r5-gem5-ref-fs0-so
          GCBH_RESTORER: /nfs/home/share/gem5_ci/tools/gcpt.bin
          H_CHECKPOINT_ROOT: /nfs/home/share/jiaxiaoyu/checkpoint_move/h_v_checkpoint_1203/checkpoint_scripts/checkpoint_scripts/archive/spec06_gcc15.0.0_rv64gcbv_base_intFppOff_for_H_V_sv39_NEMU_archgroup_2025-01-23-14-46/checkpoint-0-0-0
        run: |
          set -euo pipefail

          CONFIG_PATH="$GEM5_HOME/$CONFIG_PATH_INPUT"
          CHECKPOINT_LIST="$GEM5_HOME/${{ steps.coverage.outputs.checkpoint_list }}"
          test -r "$CONFIG_PATH"
          test -r "$CHECKPOINT_LIST"
          test -r "$GCBH_REF_SO"
          test -r "$GCBH_RESTORER"
          test -d "$H_CHECKPOINT_ROOT"

          cd "$PERF_ARCHIVE_DIR"
          runner_args=(
            --config "$CONFIG_PATH"
            --checkpoint-list "$CHECKPOINT_LIST"
            --checkpoint-root "$H_CHECKPOINT_ROOT"
            --tag spec_all
            --benchmarks "$SPECIFIC_BENCHMARKS_INPUT"
            --servers "${DISTRIBUTED_SERVERS:-local}"
            --jobs-per-server "$DISTRIBUTED_JOBS_PER_SERVER"
            --gem5-home "$GEM5_HOME"
            --build-type fast
            --ref-so "$GCBH_REF_SO"
            --restorer "$GCBH_RESTORER"
            --maxinsts 40000000
            --dram-ini "$GEM5_HOME/ext/dramsim3/xiangshan_configs/xiangshan_DDR4_8Gb_x8_3200_2ch.ini"
            --pf-control-profile "${PF_CONTROL_PROFILE_INPUT:-off}"
            --extra-args "$EXTRA_GEM5_ARGS_RAW"
          )
          if [ -n "$DISTRIBUTED_SERVERS" ]; then
            runner_args+=(
              --require-idle-cpus "$DISTRIBUTED_JOBS_PER_SERVER"
              --idle-probe-mode physical
              --dispatch-host ci-runner@172.28.9.101
              --launch-retries 3
              --launch-retry-delay 30
              --launch-interval 0.5
              --ssh-option StrictHostKeyChecking=accept-new
              --ssh-option UserKnownHostsFile="$PERF_ARCHIVE_DIR/known_hosts"
              --ssh-option ConnectTimeout=10
            )
          fi
          python3 "$GEM5_HOME/util/xs_scripts/h_spec06_perf.py" run "${runner_args[@]}" \
            | tee -a "$PERF_ARCHIVE_DIR/runner.log"

      - name: Score and validate H SPEC06 result
        id: score
        if: always()
        env:
          GEM5_HOME: ${{ github.workspace }}
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
        run: |
          set -euo pipefail
          SCORE_DIR="$PERF_ARCHIVE_DIR/h_score"
          STATUS_DIR="$SCORE_DIR/h_status"
          mkdir -p "$SCORE_DIR"
          python3 "$GEM5_HOME/util/xs_scripts/h_spec06_perf.py" score \
            --json "$GEM5_HOME/${{ steps.coverage.outputs.selection_json }}" \
            --result-dir "$PERF_ARCHIVE_DIR/spec_all" \
            --out-dir "$STATUS_DIR" \
            --benchmarks "$SPECIFIC_BENCHMARKS_INPUT" \
            --label "${{ steps.coverage.outputs.label }}"

          export PYTHONPATH="$GEM5_HOME/gem5_data_proc:/nfs/home/yanyue/.local/lib/python3.12/site-packages:$PYTHONPATH"
          cd "$GEM5_HOME/gem5_data_proc"
          bash example-scripts/gem5-score-ci.sh \
            "$PERF_ARCHIVE_DIR/spec_all" \
            "$GEM5_HOME/${{ steps.coverage.outputs.cluster_config }}" \
            > "$SCORE_DIR/score.txt"
          cp "$SCORE_DIR/score.txt" "$GEM5_HOME/score.txt"
          cp "$SCORE_DIR/score.txt" "$PERF_ARCHIVE_DIR/score.txt"
          cp results/gem5-score-example.csv "$SCORE_DIR/"
          cp results/gem5-score-example-score.csv "$SCORE_DIR/"

          cat "$SCORE_DIR/score.txt"
          {
            echo "### H SPEC06 performance result"
            echo '```'
            tail -n 42 "$SCORE_DIR/score.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FINAL_SCORE=$(grep "Estimated Int score per GHz:" "$SCORE_DIR/score.txt" | awk '{print $NF}')
          echo "### Key indicators" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final Int score per GHz: **${FINAL_SCORE}**" >> "$GITHUB_STEP_SUMMARY"
          python3 "$GEM5_HOME/util/xs_scripts/h_spec06_perf.py" validate \
            --summary "$STATUS_DIR/summary.json"

      - name: Upload H score artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.coverage.outputs.archive_name }}-score-${{ github.run_number }}
          path: |
            ${{ steps.archive.outputs.target_dir }}/metadata.txt
            ${{ steps.archive.outputs.target_dir }}/checkpoint_selection.lst
            ${{ steps.archive.outputs.target_dir }}/runner.log
            ${{ steps.archive.outputs.target_dir }}/h_score
          retention-days: 30
