name: Performance CI Monitor

on:
  workflow_run:
    workflows:
      - gem5 Ideal BTB Performance Test
      - gem5 Align BTB Performance Test(0.3c)
      - gem5 SMT SPEC2006 Performance Test(0.3c)
      - Manual Performance Test
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed performance workflow run ID to analyze'
        required: true
        type: string
      baseline_run_id:
        description: 'Optional explicit compatible baseline run ID'
        required: false
        type: string
      trigger_ai:
        description: 'Generate a CRS summary for detected anomalies'
        required: true
        type: boolean
        default: true
      force_ai:
        description: 'Generate a CRS summary even when thresholds are not crossed'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: perf-monitor-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, node]
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Never execute monitor code from a manually selected feature branch,
          # because the later CRS step receives a repository secret.
          ref: xs-dev
          persist-credentials: false

      - name: Analyze completed performance run
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            --repo "$GITHUB_REPOSITORY"
            --run-id "$SOURCE_RUN_ID"
            --output-dir "$RUNNER_TEMP/perf-monitor"
            --policy "$GITHUB_WORKSPACE/.github/perf-monitor-policy.json"
          )
          if [ -n "$BASELINE_RUN_ID" ]; then
            args+=(--baseline-run-id "$BASELINE_RUN_ID")
          fi
          python3 util/ci/perf_monitor.py "${args[@]}"

      - name: Summarize anomaly with CRS
        id: crs
        if: >-
          (github.event_name == 'workflow_run' || inputs.trigger_ai == true) &&
          (steps.analyze.outputs.should_investigate == 'true' || inputs.force_ai == true)
        continue-on-error: true
        env:
          CRS_OPENAI_API_KEY: ${{ secrets.CRS_OPENAI_API_KEY }}
          CRS_OPENAI_BASE_URL: http://172.28.11.121:18080
          CRS_MODEL: gpt-5.6-sol
          LD_PRELOAD: ''
        run: |
          python3 util/ci/crs_perf_summary.py \
            --analysis "$RUNNER_TEMP/perf-monitor/analysis.json" \
            --output "$RUNNER_TEMP/perf-monitor/ai-summary.md"

      - name: Publish analysis summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/perf-monitor/summary.md" ]; then
            cat "$RUNNER_TEMP/perf-monitor/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s "$RUNNER_TEMP/perf-monitor/ai-summary.md" ]; then
            {
              echo
              echo '## CRS anomaly summary'
              echo
              cat "$RUNNER_TEMP/perf-monitor/ai-summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.crs.outcome }}" = "failure" ]; then
            echo 'CRS summary was unavailable; deterministic analysis is still valid.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload monitor analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-monitor-analysis
          path: ${{ runner.temp }}/perf-monitor
          retention-days: 30
