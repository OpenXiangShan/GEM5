[iteration]
working_mode=single
#允许最多同时运行的checkpoints
max_process=48
#迭代次数
num = 1
#结束后不做延迟
end_delay= 0
#忽略迭代中的错误(仍会执行except并最终返回-1)
#迭代次数为1时不用关心
except_mode = stop
#运行时动态分配处理器核心
smode=dy
#静态分配处理器核心范围(不用关心)
srange=1,2



[pre-work]
pre-task = 
task = echo will start running GEM5
except-task =

#当前目录即为仓库根目录
[work-rungem5]
binpath = {ck_path}
#禁用numa
numacores = 0
pre-task = 
task = {set_var} && \
    ./build/RISCV/gem5.opt \
    --outdir=$sublog$ \
    ./configs/example/kmhv3.py \
    --enable-h-gcpt \
    --restore-rvh-cpt \
    --gcpt-restorer={h_restorer} \
    --generic-rv-cpt=$binfile$ \
    --maxinsts=40000000 \
    --mem-size=16GB
post-task = echo run successfully at $binfile$
except-task = echo gem5 running error at $binfile$!


[post-work]
task= 
post-task = echo run finish
except-task =
