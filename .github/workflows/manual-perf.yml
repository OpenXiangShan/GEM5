name: Manual Performance Test
run-name: ${{ format('{0} - {1} - {2}{3} - {4} - {5} [{6}]', inputs.note || 'Manual Performance Test', inputs.configuration, startsWith(inputs.benchmark_type, 'custom') && inputs.checkpoint_path && format('{0} [{1}]', inputs.benchmark_type, inputs.checkpoint_path) || inputs.benchmark_type, inputs.specific_benchmarks && format(' ({0})', inputs.specific_benchmarks) || '', inputs.branch || github.ref_name, inputs.extra_args || 'no-extra-args', inputs.distributed_servers && 'distributed' || 'local') }}

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Title prefix for this manual perf run'
        required: false
        type: string
        default: 'Manual Performance Test'
      configuration:
        description: 'Choose Kunminghu configuration'
        required: true
        type: choice
        default: 'idealkmhv3.py'
        options:
          - 'kmhv2.py'
          - 'kmhv3.py'
          - 'idealkmhv3.py'
          - 'smt_idealkmhv3.py'
      benchmark_type:
        description: 'Benchmark coverage type'
        required: true
        type: choice
        default: 'spec06-rva23-novec-gcc16-1.0c'
        options:
          - spec06-rva23-novec-gcc16-0.3c
          - spec06-rva23-novec-gcc16-1.0c
          - gcc12-spec06-smt-0.3c
          - gcc12-spec06-smt-1.0c
          - gcc12-spec06-smt-int-1.0c
          - h-spec06-0.5c
          - h-spec06-1.0c
          - gcc12-spec06-0.8c
          - gcc12-spec06-1.0c
          - xscc-spec06-1.0c
          - gcc16-spec17-smt-1.0c
          - spec17-1.0c
          - spec06-rvv-1.0c
          - spec06int-rvv-0.8c
          - gcc15-spec26-0.3c
          - gcc15-spec26-1.0c
          - trace-google
          - trace-google-0.3c
          - trace-cbp
          - trace-cbp-0.3c
          - custom
          - custom-spec06
          - custom-spec17
          - custom-spec26
      checkpoint_path:
        description: 'Custom profile/checkpoint directory (custom auto-detects SPEC06/17/26 from path; all JSON points run by default)'
        required: false
        type: string
        default: ''
      json_path:
        description: 'Custom weights JSON (empty: discover checkpoints_all.json or cluster-0-0.json in the profile)'
        required: false
        type: string
        default: ''
      specific_benchmarks:
        description: 'Specific benchmarks to run (comma-separated, eg. "mcf,gcc"), leave empty to run all'
        required: false
        type: string
        default: ''
      extra_args:
        description: 'Extra gem5 args appended to config runs, e.g. --l1d-enable-lldp, --l2-enable-lldp, --l1d-hwp-type=MultiPrefetcher, or --enable-dynamic-pf=True'
        required: false
        type: string
        default: ''
      gcbv_ref_so:
        description: 'Custom single-core REF (empty: pinned REF with memdedup; custom dedup REF also needs --enable-mem-dedup in extra_args)'
        required: false
        type: string
        default: ''
      distributed_servers:
        description: 'Optional distributed server list. Use default for the shared CI pool; leave empty to run locally'
        required: false
        type: string
        default: ''
      distributed_jobs_per_server:
        description: 'Distributed jobs per server'
        required: false
        type: number
        default: 32
      branch:
        description: 'Branch, tag or SHA to test (leave empty for current branch)'
        required: false
        type: string

jobs:
  perf_test:
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: ${{ contains(inputs.benchmark_type, '-smt-') && 'configs/example/smt_idealkmhv3.py' || format('configs/example/{0}', inputs.configuration) }}
      benchmark_type: ${{ inputs.benchmark_type }}
      checkpoint_path: ${{ inputs.checkpoint_path }}
      json_path: ${{ inputs.json_path }}
      specific_benchmarks: ${{ inputs.specific_benchmarks }}
      extra_args: ${{ inputs.extra_args }}
      gcbv_ref_so: ${{ inputs.gcbv_ref_so }}
      distributed_servers: ${{ inputs.distributed_servers }}
      distributed_jobs_per_server: ${{ fromJSON(github.event.inputs.distributed_jobs_per_server || '32') }}
      pr_sha: ${{ inputs.branch || github.sha }}
      check_result: true
      timeout_minutes: 720
