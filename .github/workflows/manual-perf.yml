name: Manual Performance Test
run-name: ${{ format('{0} - {1} - {2}{3} - {4} - {5} - {6}', github.event.inputs.note || 'Manual Performance Test', github.event.inputs.configuration, github.event.inputs.benchmark_type, github.event.inputs.specific_benchmarks && format(' ({0})', github.event.inputs.specific_benchmarks) || '', github.event.inputs.branch || github.ref_name, github.event.inputs.vector_type, github.event.inputs.extra_args || 'no-extra-args') }}

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Title prefix for this manual perf run'
        required: false
        type: string
        default: 'Manual Performance Test'
      configuration:
        description: 'Choose Kunminghu configuration'
        required: true
        type: choice
        default: 'idealkmhv3.py'
        options:
          - 'kmhv2.py'
          - 'kmhv3.py'
          - 'idealkmhv3.py'
          - 'smt_idealkmhv3.py'
      benchmark_type:
        description: 'Benchmark coverage type'
        required: true
        type: choice
        default: 'spec06-rva23-novec-gcc16-1.0c'
        options:
          - spec06-rva23-novec-gcc16-0.3c
          - spec06-rva23-novec-gcc16-1.0c
          - gcc15-spec06-0.3c
          - gcc15-spec06-1.0c
          - gcc12-spec06-0.3c
          - gcc12-spec06-smt-0.3c
          - gcc12-spec06-smt-1.0c
          - gcc12-spec06-smt-int-1.0c
          - gcc12-spec06-0.8c
          - gcc12-spec06-1.0c
          - spec17-1.0c
          - spec06-rvv-1.0c
          - spec06int-rvv-0.8c
          - gcc15-spec26-0.3c
          - gcc15-spec26-1.0c
      specific_benchmarks:
        description: 'Specific benchmarks to run (comma-separated, eg. "mcf,gcc"), leave empty to run all'
        required: false
        type: string
        default: ''
      vector_type:
        description: 'Vector decode strategy (only for rvv benchmarks)'
        required: false
        type: choice
        default: 'base'
        options:
          - base
      extra_args:
        description: 'Extra gem5 args appended to config runs, e.g. --dramsim3-ini=$GEM5_HOME/ext/dramsim3/xiangshan_configs/xiangshan_DDR4_8Gb_x8_3200_8ch.ini --enable-dynamic-pf=True'
        required: false
        type: string
        default: ''
      distributed_servers:
        description: 'Optional distributed server list. Use default for node020-node029,node033-node034,node036-node039; leave empty for old single-runner parallel path'
        required: false
        type: string
        default: ''
      distributed_jobs_per_server:
        description: 'Distributed jobs per server'
        required: false
        type: number
        default: 32
      branch:
        description: 'Branch, tag or SHA to test (leave empty for current branch)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      config_path: ${{ steps.resolve.outputs.config_path }}
      pr_sha: ${{ steps.resolve.outputs.pr_sha }}
    steps:
      - name: Resolve parameters
        id: resolve
        run: |
          if [[ "${{ github.event.inputs.benchmark_type }}" == gcc12-spec06-smt-* ]]; then
            echo "config_path=configs/example/smt_idealkmhv3.py" >> $GITHUB_OUTPUT
          else
            echo "config_path=configs/example/${{ github.event.inputs.configuration }}" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "pr_sha=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "pr_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  perf_test:
    needs: setup
    uses: ./.github/workflows/gem5-perf-template.yml
    with:
      config_path: ${{ needs.setup.outputs.config_path }}
      benchmark_type: ${{ github.event.inputs.benchmark_type }}
      specific_benchmarks: ${{ github.event.inputs.specific_benchmarks }}
      vector_type: ${{ github.event.inputs.vector_type }}
      extra_args: ${{ github.event.inputs.extra_args }}
      distributed_servers: ${{ github.event.inputs.distributed_servers }}
      distributed_jobs_per_server: ${{ fromJSON(github.event.inputs.distributed_jobs_per_server || '32') }}
      pr_sha: ${{ needs.setup.outputs.pr_sha }}
      check_result: true
      timeout_minutes: 720
