name: Manual Solver Run
run-name: ${{ format('{0} - {1} - {2} - {3}', github.event.inputs.note || 'Manual Solver Run', github.event.inputs.problem_ref, github.event.inputs.benchmark_type, github.event.inputs.branch || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Title prefix for this solver run"
        required: false
        type: string
        default: "Manual Solver Run"
      problem_ref:
        description: "Solver problem spec. Accepts VTAGEIPCSearch, configs/solver_specs/vtage_ipc_search.py, or configs/solver_specs/vtage_ipc_search.py:VTAGEIPCSearch"
        required: true
        type: string
        default: "VTAGEIPCSearch"
      benchmark_type:
        description: "Benchmark coverage type used to pick the workload list and score config"
        required: true
        type: choice
        default: "gcc15-spec06-0.3c"
        options:
          - gcc12-spec06-0.3c
          - gcc12-spec06-smt-0.3c
          - gcc12-spec06-smt-1.0c
          - gcc12-spec06-0.8c
          - gcc12-spec06-1.0c
          - gcc15-spec06-0.3c
          - gcc15-spec06-0.8c
          - gcc15-spec06-1.0c
          - spec17-1.0c
          - spec06-rvv-1.0c
          - spec06int-rvv-0.8c
      max_parallel_trials:
        description: "Maximum number of solver trials executed concurrently"
        required: false
        type: string
        default: "4"
      max_parallel_workloads:
        description: "Maximum number of workloads executed concurrently inside one trial. The solver executor applies this directly for both benchmark_type and custom_bin runs."
        required: false
        type: string
        default: "1"
      solver_kind:
        description: "Candidate generator"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - grid
          - random
      specific_benchmarks:
        description: "Optional comma-separated case-insensitive substring filters matched against each workload-list line from the selected benchmark_type. Empty means run all workloads. Leave empty when custom_bin is set."
        required: false
        type: string
        default: ""
      custom_bin:
        description: "Optional absolute or repo-relative custom checkpoint input. Accepts one path or multiple comma/newline-separated .bin/.gz/.zstd paths. When set, it replaces workload-list filtering."
        required: false
        type: string
        default: ""
      extra_args:
        description: "Optional extra gem5 args appended to each trial, for example --maxinsts=1000000"
        required: false
        type: string
        default: ""
      max_trials:
        description: "Optional max trial override"
        required: false
        type: string
        default: ""
      branch:
        description: "Branch, tag or SHA to test"
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      pr_sha: ${{ steps.resolve.outputs.pr_sha }}
      run_dir: ${{ steps.resolve.outputs.run_dir }}
    steps:
      - name: Resolve parameters
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "pr_sha=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "run_dir=solver_runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  solve:
    needs: setup
    runs-on: [self-hosted, node]
    timeout-minutes: 720
    env:
      GCBV_REF_SO: "/nfs/home/share/gem5_ci/ref/normal/riscv64-nemu-interpreter-so"
      GEM5_BUILD_TYPE: fast
      M5_OVERRIDE_PY_SOURCE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.pr_sha }}
          persist-credentials: false

      - uses: ./.github/actions/build-dramsim

      - name: Build GEM5 fast
        run: |
          export GEM5_HOME=$(pwd)
          bash util/pgo/basic_pgo_new.sh

      - name: Run solver controller
        run: |
          export GEM5_HOME=$(pwd)
          export PYTHONUNBUFFERED=1
          mkdir -p "${{ needs.setup.outputs.run_dir }}"
          cmd=(
            python3 -u util/solver/run_solver.py
            --problem-ref "${{ github.event.inputs.problem_ref }}"
            --workdir "${{ needs.setup.outputs.run_dir }}"
            --benchmark-type "${{ github.event.inputs.benchmark_type }}"
            --solver-kind "${{ github.event.inputs.solver_kind }}"
            --max-parallel-trials "${{ github.event.inputs.max_parallel_trials }}"
            --max-parallel-workloads "${{ github.event.inputs.max_parallel_workloads }}"
          )
          if [ -n "${{ github.event.inputs.specific_benchmarks }}" ]; then
            cmd+=(--specific-benchmarks "${{ github.event.inputs.specific_benchmarks }}")
          fi
          if [ -n "${{ github.event.inputs.custom_bin }}" ]; then
            cmd+=(--custom-bin "${{ github.event.inputs.custom_bin }}")
          fi
          if [ -n "${{ github.event.inputs.extra_args }}" ]; then
            cmd+=("--extra-args=${{ github.event.inputs.extra_args }}")
          fi
          if [ -n "${{ github.event.inputs.max_trials }}" ]; then
            cmd+=(--max-trials "${{ github.event.inputs.max_trials }}")
          fi
          "${cmd[@]}"

      - name: Upload solver artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solver-run-${{ github.run_id }}
          path: ${{ needs.setup.outputs.run_dir }}
