# Plain Actions workflow; retained path preserves the existing manual-run entry.
# This file is no longer generated by gh-aw.
name: Repo Status

on:
  schedule:
    # 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write

concurrency:
  group: repo-status-publish
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check report script
        run: python3 -m unittest discover -s .github/scripts -p 'test_repo_status.py'
      - name: Collect activity, summarize once, and publish Chinese report
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 .github/scripts/repo_status.py
      - name: Save report and source data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-status
          path: |
            repo-status-data.json
            repo-status-report.md
          if-no-files-found: ignore
          retention-days: 7
