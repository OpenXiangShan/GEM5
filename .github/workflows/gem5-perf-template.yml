name: gem5 Performance Test Template (Unified)

on:
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
        description: "gem5 config file path (relative to repo root), e.g. configs/example/idealkmhv3.py"
      extra_args:
        required: false
        type: string
        default: ""
        description: "Extra arguments for gem5 (e.g., --disable-mgsc). Only works with .py config files."
      benchmark_type:
        required: true
        type: string
        description: "Benchmark type registered in util/xs_scripts/ci/benchmarks.py"
      checkpoint_path:
        required: false
        type: string
        default: ""
        description: "Custom profile or checkpoint directory."
      json_path:
        required: false
        type: string
        default: ""
        description: "Custom weights JSON; empty discovers the full-coverage JSON."
      specific_benchmarks:
        required: false
        type: string
        default: ""
        description: "Comma-separated benchmark filters. Empty means run all workloads in checkpoint list."
      gcbv_ref_so:
        required: false
        type: string
        default: ""
        description: "Custom single-core REF; empty selects the pinned memdedup REF."
      check_result:
        required: false
        type: boolean
        description: "Whether to check result (failed ckpts)"
        default: true
      pr_sha:
        required: false
        type: string
        description: "Specific commit SHA to checkout (takes precedence)"
      timeout_minutes:
        required: false
        type: number
        default: 360
        description: "Job timeout in minutes"
      distributed_servers:
        required: false
        type: string
        default: ""
        description: "Optional distributed runner server list. Empty runs locally; 'default' uses the shared CI pool."
      distributed_jobs_per_server:
        required: false
        type: number
        default: 32
        description: "Maximum concurrent gem5 jobs per distributed server."

permissions:
  contents: read

jobs:
  run_performance_test:
    runs-on: [self-hosted, node]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    continue-on-error: false
    name: XS-GEM5 - Run performance test (${{ inputs.benchmark_type }})
    steps:
      - name: Reject untrusted PR head checkout
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing to checkout an external fork PR head under pull_request_target."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Check out CI tools from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .perf-workflow
          sparse-checkout: util/xs_scripts/ci
          persist-credentials: false

      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 fast
        run: |
          export GEM5_HOME="$PWD"
          GCBV_REF_SO="$(python3 util/nemu_ref/resolve.py normal)"
          export GCBV_REF_SO
          bash util/pgo/basic_pgo_new.sh

      - name: Run performance test
        id: perf
        working-directory: .perf-workflow
        env:
          PERF_INPUTS: ${{ toJSON(inputs) }}
        run: python3 -m util.xs_scripts.ci.run_perf_ci --repo "$GITHUB_WORKSPACE"

      - name: Score performance test
        working-directory: .perf-workflow
        shell: bash
        env:
          ARCHIVE: ${{ steps.perf.outputs.archive }}
          BENCHMARK_TYPE: ${{ steps.perf.outputs.benchmark_type }}
          TRACE_FORMAT: ${{ steps.perf.outputs.trace_format }}
          SCORE_SCRIPT: ${{ steps.perf.outputs.score_script }}
          PARTIAL: ${{ steps.perf.outputs.partial }}
        run: |
          score="$ARCHIVE/score.txt"
          if [[ -n "$TRACE_FORMAT" ]]; then
            python3 -m util.xs_scripts.ci.trace_report "$BENCHMARK_TYPE" "$ARCHIVE" > "$score"
          else
            tmp=$(mktemp -d)
            trap 'rm -rf -- "$tmp"' EXIT
            rsync -a --exclude=/.git --exclude=/results /nfs/home/share/gem5_ci/gem5_data_proc/ "$tmp/scorer/"
            mkdir "$tmp/spec_all"
            while IFS= read -r name; do
              ln -s -- "$ARCHIVE/spec_all/$name" "$tmp/spec_all/$name"
            done < "$ARCHIVE/passed.lst"
            cd "$tmp/scorer" || exit 1
            export GEM5_HOME="$GITHUB_WORKSPACE"
            export PYTHONPATH="$PWD:/nfs/home/yanyue/.local/lib/python3.12/site-packages:${PYTHONPATH:-}"
            {
              if [[ -n "$PARTIAL" ]]; then echo "$PARTIAL"; fi
              bash -e "example-scripts/$SCORE_SCRIPT" "$tmp/spec_all" "$ARCHIVE/cluster.json"
            } > "$score"
          fi
          {
            echo "### ${PARTIAL:-Performance result}"
            echo '```'
            if [[ -n "$TRACE_FORMAT" ]]; then cat "$score"; else tail -n 42 "$score"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload score artifact
        if: ${{ always() && steps.perf.outputs.archive != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.perf.outputs.artifact_name }}
          path: ${{ steps.perf.outputs.archive }}/score.txt
          if-no-files-found: warn
          retention-days: 30
