name: gem5 Performance Test Template (Unified)

on:
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
        description: "gem5 config file path (relative to repo root), e.g. configs/example/idealkmhv3.py"
      extra_args:
        required: false
        type: string
        default: ""
        description: "Extra arguments for gem5 (e.g., --disable-mgsc). Only works with .py config files."
      benchmark_type:
        required: true
        type: string
        description: "Benchmark type registered in util/xs_scripts/perf_benchmarks.py"
      checkpoint_path:
        required: false
        type: string
        default: ""
        description: "Custom profile or checkpoint directory."
      json_path:
        required: false
        type: string
        default: ""
        description: "Custom weights JSON; empty discovers the full-coverage JSON."
      specific_benchmarks:
        required: false
        type: string
        default: ""
        description: "Comma-separated benchmark filters. Empty means run all workloads in checkpoint list."
      gcbv_ref_so:
        required: false
        type: string
        default: ""
        description: "Custom single-core REF; empty selects the pinned memdedup REF."
      check_result:
        required: false
        type: boolean
        description: "Whether to check result (failed ckpts)"
        default: true
      checkpoint_progress:
        type: boolean
        default: false
        description: "Show perf-trigger-style checkpoint progress instead of launcher output."
      pr_sha:
        required: false
        type: string
        description: "Specific commit SHA to checkout (takes precedence)"
      timeout_minutes:
        required: false
        type: number
        default: 360
        description: "Job timeout in minutes"
      distributed_servers:
        required: false
        type: string
        default: ""
        description: "Optional distributed runner server list. Empty keeps using parallel_sim.sh; 'default' uses the shared SMT node pool."
      distributed_jobs_per_server:
        required: false
        type: number
        default: 32
        description: "Maximum concurrent gem5 jobs per distributed server."

permissions:
  contents: read

jobs:
  run_performance_test:
    runs-on: [self-hosted, node]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    continue-on-error: false
    name: XS-GEM5 - Run performance test (${{ inputs.benchmark_type }})
    steps:
      - name: Reject untrusted PR head checkout
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing to checkout an external fork PR head under pull_request_target."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set benchmark configuration
        id: config
        env:
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          CHECKPOINT_PATH_INPUT: ${{ inputs.checkpoint_path }}
          JSON_PATH_INPUT: ${{ inputs.json_path }}
          GCBV_REF_INPUT: ${{ inputs.gcbv_ref_so }}
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
        run: |
          python3 util/xs_scripts/perf_benchmarks.py \
            "$BENCHMARK_TYPE" \
            --checkpoint-path "$CHECKPOINT_PATH_INPUT" \
            --json-path "$JSON_PATH_INPUT" \
            --output-dir "$GITHUB_WORKSPACE/.perf-inputs" \
            --github-output "$GITHUB_OUTPUT"

          if [[ "$BENCHMARK_TYPE" == trace-* ]]; then
            : # Trace replay needs no checkpoint REF/restorer/mem-dedup setup.
          elif [[ "$BENCHMARK_TYPE" == h-spec06-* ]]; then
            H_REF_SO="$(python3 util/nemu_ref/resolve.py h)"
            H_RESTORER="/nfs/home/share/gem5_ci/tools/gcpt.bin"
            H_DRAM_INI="$GITHUB_WORKSPACE/ext/dramsim3/xiangshan_configs/xiangshan_DDR4_8Gb_x8_3200_2ch.ini"
            echo "profile_ref_so=$H_REF_SO" >> "$GITHUB_OUTPUT"
            echo "profile_restorer=$H_RESTORER" >> "$GITHUB_OUTPUT"
            echo "profile_extra_args=--enable-h-gcpt --restore-rvh-cpt --gcpt-restorer=$H_RESTORER --difftest-ref-so=$H_REF_SO --maxinsts=40000000 --dramsim3-ini=$H_DRAM_INI" >> "$GITHUB_OUTPUT"
          elif [[ "$BENCHMARK_TYPE" == gcc12-spec06-smt-* || "$CONFIG_PATH_INPUT" == */smt_idealkmhv3.py ]]; then
            MULTI_REF_SO="$(python3 util/nemu_ref/resolve.py multi)"
            echo "multi_ref_so=$MULTI_REF_SO" >> "$GITHUB_OUTPUT"
            echo "profile_extra_args=--mem-size=16GB" >> "$GITHUB_OUTPUT"
          elif [[ -z "$GCBV_REF_INPUT" ]]; then
            GCBV_REF_INPUT="$(python3 util/nemu_ref/resolve.py normal-dedup)"
            echo "profile_extra_args=--enable-mem-dedup" >> "$GITHUB_OUTPUT"
          fi
          echo "gcbv_ref_so=$GCBV_REF_INPUT" >> "$GITHUB_OUTPUT"

          case "${{ inputs.config_path }}" in
            */kmhv3.py|*/kmhv2.py)
              artifact_name_prefix="score"
              ;;
            */idealkmhv3.py)
              artifact_name_prefix="score-ideal"
              ;;
            */smt_idealkmhv3.py)
              artifact_name_prefix="score-smt-ideal"
              ;;
            *)
              artifact_name_prefix="score-unknown"
              ;;
          esac
          echo "artifact_name=${artifact_name_prefix}-${{ inputs.benchmark_type }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-dramsim
      - name: Build GEM5 fast
        run: |
          export GEM5_HOME=$(pwd)
          # PGO always uses a single-core raw CoreMark image.
          GCBV_REF_SO="$(python3 util/nemu_ref/resolve.py normal)"
          export GCBV_REF_SO
          # use pgo profile to build gem5
          bash util/pgo/basic_pgo_new.sh

      - name: Prepare performance archive
        id: archive
        env:
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
          BENCHMARK_TYPE_INPUT: ${{ steps.config.outputs.benchmark_type }}
          ARCHIVE_SUBDIR_INPUT: ${{ steps.config.outputs.archive_subdir }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
          EXTRA_ARGS_INPUT: ${{ inputs.extra_args }}
          CHECKPOINT_LIST_INPUT: ${{ steps.config.outputs.checkpoint_list }}
          CHECKPOINT_ROOT_INPUT: ${{ steps.config.outputs.checkpoint_root_node }}
          CLUSTER_CONFIG_INPUT: ${{ steps.config.outputs.cluster_config }}
          DISTRIBUTED_SERVERS_RAW: ${{ inputs.distributed_servers }}
          DISTRIBUTED_JOBS_PER_SERVER_RAW: ${{ inputs.distributed_jobs_per_server }}
        run: |
          ARCHIVE_ROOT="/nfs/home/share/gem5_ci/performance_data"
          BENCHMARK_DIR="${ARCHIVE_ROOT}/${ARCHIVE_SUBDIR_INPUT}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          RUN_NUMBER="${{ github.run_number }}"
          CONFIG_NAME=$(basename "$CONFIG_PATH_INPUT" .py)
          CONFIG_NAME=$(printf '%s' "$CONFIG_NAME" | tr -c 'A-Za-z0-9._-' '_')
          CONFIG_NAME=${CONFIG_NAME:-config}
          TARGET_DIR="${BENCHMARK_DIR}/${TIMESTAMP}_${COMMIT_SHORT}_${CONFIG_NAME}_run${RUN_NUMBER}"
          # Keep node030-node033 and node035 out of the shared pool.
          DEFAULT_DISTRIBUTED_SERVERS="node003-node008,node020-node029,node034,node036-node042"
          DISTRIBUTED_SERVERS_INPUT="$DISTRIBUTED_SERVERS_RAW"
          DISTRIBUTED_SERVERS=$(echo "$DISTRIBUTED_SERVERS_INPUT" | xargs)
          if [ "$DISTRIBUTED_SERVERS" = "default" ]; then
            DISTRIBUTED_SERVERS="$DEFAULT_DISTRIBUTED_SERVERS"
          fi
          DISTRIBUTED_REQUIRE_IDLE_CPUS="$DISTRIBUTED_JOBS_PER_SERVER_RAW"
          DISTRIBUTED_IDLE_PROBE_MODE="physical"

          mkdir -p "$TARGET_DIR"
          cp "$CHECKPOINT_LIST_INPUT" "$TARGET_DIR/checkpoints.lst"
          # Archive SPEC or Google trace weights with the run.
          if [[ -n "$CLUSTER_CONFIG_INPUT" ]]; then
            cp "$CLUSTER_CONFIG_INPUT" "$TARGET_DIR/cluster.json"
          fi

          {
            echo "benchmark_dir=$BENCHMARK_DIR"
            echo "target_dir=$TARGET_DIR"
            echo "timestamp=$TIMESTAMP"
            echo "commit_short=$COMMIT_SHORT"
            echo "config_name=$CONFIG_NAME"
            echo "run_number=$RUN_NUMBER"
            echo "distributed_servers=$DISTRIBUTED_SERVERS"
            echo "distributed_require_idle_cpus=$DISTRIBUTED_REQUIRE_IDLE_CPUS"
            echo "distributed_idle_probe_mode=$DISTRIBUTED_IDLE_PROBE_MODE"
          } >> "$GITHUB_OUTPUT"

          echo "timestamp: $TIMESTAMP" > "$TARGET_DIR/metadata.txt"
          echo "commit: $(git rev-parse HEAD)" >> "$TARGET_DIR/metadata.txt"
          echo "commit_short: $COMMIT_SHORT" >> "$TARGET_DIR/metadata.txt"
          echo "branch: ${GITHUB_REF#refs/heads/}" >> "$TARGET_DIR/metadata.txt"
          echo "config_path: $CONFIG_PATH_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "config_name: $CONFIG_NAME" >> "$TARGET_DIR/metadata.txt"
          echo "run_number: $RUN_NUMBER" >> "$TARGET_DIR/metadata.txt"
          echo "benchmark_type: $BENCHMARK_TYPE_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "checkpoint_root: $CHECKPOINT_ROOT_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "checkpoint_list: $CHECKPOINT_LIST_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "cluster_config: $CLUSTER_CONFIG_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "specific_benchmarks: $SPECIFIC_BENCHMARKS_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_servers_input: $DISTRIBUTED_SERVERS_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_servers: $DISTRIBUTED_SERVERS" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_server_domain: " >> "$TARGET_DIR/metadata.txt"
          echo "distributed_jobs_per_server: $DISTRIBUTED_JOBS_PER_SERVER_RAW" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_require_idle_cpus: $DISTRIBUTED_REQUIRE_IDLE_CPUS" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_idle_probe_mode: $DISTRIBUTED_IDLE_PROBE_MODE" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_idle_cpu_threshold: 30" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_ssh_config: " >> "$TARGET_DIR/metadata.txt"
          echo "distributed_ssh_user: " >> "$TARGET_DIR/metadata.txt"
          echo "distributed_launch_retries: 3" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_launch_retry_delay: 30" >> "$TARGET_DIR/metadata.txt"
          echo "distributed_launch_interval: 0.5" >> "$TARGET_DIR/metadata.txt"
          printf 'extra_args: %s\n' "$EXTRA_ARGS_INPUT" >> "$TARGET_DIR/metadata.txt"
          echo "workflow_run_id: ${{ github.run_id }}" >> "$TARGET_DIR/metadata.txt"

          {
            echo "### Live archive output"
            echo "- Path: \`$TARGET_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: XS-GEM5 - Run performance test
        # ${{ steps.config.outputs.comment }}
        env:
          GCBV_REF_SO: ${{ steps.config.outputs.gcbv_ref_so }}
          GCBV_MULTI_CORE_REF_SO: ${{ steps.config.outputs.multi_ref_so }}
          GEM5_HOME: ${{ github.workspace }}
          GEM5_BUILD_TYPE: fast
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
          BENCHMARK_TYPE_INPUT: ${{ steps.config.outputs.benchmark_type }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
          EXTRA_GEM5_ARGS_RAW: ${{ inputs.extra_args }}
          CHECKPOINT_LIST: ${{ steps.archive.outputs.target_dir }}/checkpoints.lst
          CHECKPOINT_PROGRESS: ${{ inputs.checkpoint_progress }}
          CHECKPOINT_ROOT_NODE: ${{ steps.config.outputs.checkpoint_root_node }}
          DISTRIBUTED_SERVERS: ${{ steps.archive.outputs.distributed_servers }}
          DISTRIBUTED_JOBS_PER_SERVER: ${{ inputs.distributed_jobs_per_server }}
          DISTRIBUTED_REQUIRE_IDLE_CPUS: ${{ steps.archive.outputs.distributed_require_idle_cpus }}
          DISTRIBUTED_IDLE_PROBE_MODE: ${{ steps.archive.outputs.distributed_idle_probe_mode }}
          GCBH_REF_SO: ${{ steps.config.outputs.profile_ref_so }}
          GCBH_RESTORER: ${{ steps.config.outputs.profile_restorer }}
          PROFILE_EXTRA_ARGS: ${{ steps.config.outputs.profile_extra_args }}
          # A nonempty trace format selects trace replay.
          TRACE_FORMAT: ${{ steps.config.outputs.trace_format }}
        run: |
          if [[ "$CHECKPOINT_PROGRESS" == true ]]; then
            unset LD_PRELOAD
          fi
          mkdir -p "$PERF_ARCHIVE_DIR"
          cd "$PERF_ARCHIVE_DIR"

          CONFIG_PATH="$CONFIG_PATH_INPUT"
          if [[ "$CONFIG_PATH" == /* ]]; then
            echo "Error: config_path must be repo-root-relative, got absolute path: '$CONFIG_PATH'"
            exit 1
          fi
          if [[ "$CONFIG_PATH" != *.py ]]; then
            echo "Error: config_path must be a .py gem5 config file path, got: '$CONFIG_PATH'"
            exit 1
          fi

          CONFIG_PATH="$GEM5_HOME/$CONFIG_PATH"
          if [[ -n "$GCBV_MULTI_CORE_REF_SO" ]]; then
            export GCB_MULTI_CORE_RESTORER=""
          fi

          extra_args="$EXTRA_GEM5_ARGS_RAW"
          extra_args="$(echo "$extra_args" | xargs)"
          extra_args="${extra_args//\$\{GEM5_HOME\}/$GEM5_HOME}"
          extra_args="${extra_args//\$GEM5_HOME/$GEM5_HOME}"
          extra_args="$(echo "$extra_args $PROFILE_EXTRA_ARGS" | xargs)"
          if [[ "$CHECKPOINT_PROGRESS" != true ]]; then
            echo "Resolved extra gem5 args: $extra_args"
          fi
          printf 'resolved_extra_args: %s\n' "$extra_args" >> "$PERF_ARCHIVE_DIR/metadata.txt"

          # Reuse checkpoint scheduling and fallback; trace needs no REF.
          trace_args=()
          if [[ -n "$TRACE_FORMAT" ]]; then
            trace_args=("--trace-format=$TRACE_FORMAT")
          else
            ref_so="${GCBV_MULTI_CORE_REF_SO:-${GCBH_REF_SO:-$GCBV_REF_SO}}"
            test -r "$ref_so"
            printf 'ref_so: %s\n' "$ref_so" >> "$PERF_ARCHIVE_DIR/metadata.txt"
            sha256sum "$ref_so" >> "$PERF_ARCHIVE_DIR/metadata.txt"
            if [[ -f "$(dirname "$ref_so")/manifest.json" ]]; then
              cp "$(dirname "$ref_so")/manifest.json" "$PERF_ARCHIVE_DIR/ref-manifest.json"
            fi

            if [ -n "$GCBH_REF_SO" ]; then
              test -r "$GCBH_REF_SO"
              test -r "$GCBH_RESTORER"
              test -d "$CHECKPOINT_ROOT_NODE"
              {
                echo "profile_ref_so: $GCBH_REF_SO"
                echo "profile_restorer: $GCBH_RESTORER"
              } >> "$PERF_ARCHIVE_DIR/metadata.txt"
            fi
          fi

          run_sim() {
            if [[ "$CHECKPOINT_PROGRESS" != true ]]; then
              "$@"
              return
            fi

            python3 - "$CHECKPOINT_LIST" "$SPECIFIC_BENCHMARKS_INPUT" "$TRACE_FORMAT" "$@" <<'PY'
          from itertools import islice
          import json
          import logging
          from pathlib import Path
          import socket
          import subprocess
          import sys
          import time

          listing, filters, trace, *command = sys.argv[1:]
          tokens = [token.strip().lower() for token in filters.split(",") if token.strip()]
          names = [line.split()[0] for line in Path(listing).read_text().splitlines()
                   if line.strip() and (not tokens or any(token in line.lower() for token in tokens))]
          cluster = Path("cluster.json")
          weights = {
              f"{workload}_{point}": float(weight)
              for workload, entry in json.loads(cluster.read_text()).items()
              if isinstance(entry, dict)
              for point, weight in entry.get("points", {}).items()
          } if not trace and cluster.is_file() else {}
          labels = {name: f"{name}_{weights[name]:.6f}" if name in weights else name for name in names}
          root = Path("spec_all")
          launcher_log = Path("launcher.log")
          already_done = {name for name in names if (root / name / "completed").is_file()}
          local = command[0] == "bash"
          host = socket.gethostname()
          assigned, finished = {}, set()
          failed_count = last_remaining = 0
          logging.basicConfig(level=logging.INFO, format="%(asctime)s - %(levelname)5s - %(message)s")

          def progress(level, message, *args):
              logging.log(level, "[%d,%d,%d/%d] " + message,
                          len(assigned), len(finished), failed_count, len(names), *args)

          with (
              launcher_log.open("a") as output,
              launcher_log.open(errors="replace") as launcher,
              subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT) as proc,
          ):
              servers = 1 if local else None
              if local:
                  progress(logging.INFO, "Start running %d checkpoints on %d servers", len(names), servers)
              while True:
                  status = proc.poll()
                  if servers is None:
                      for line in launcher:
                          if line.startswith("Servers: "):
                              servers = len(line.removeprefix("Servers: ").split(", "))
                              progress(logging.INFO, "Start running %d checkpoints on %d servers", len(names), servers)
                              break
                  for name in (names if servers is not None else ()):
                      if name in finished:
                          continue
                      work = root / name
                      completed = work / "completed"
                      done = completed.is_file()
                      failed = (work / "abort").is_file()
                      if name not in assigned:
                          try:
                              started_at = (work / "running").stat().st_mtime
                          except FileNotFoundError:
                              if not done and not failed:
                                  continue
                              started_at = None
                          node = host if local else ""
                          log_path = work / "log.txt"
                          if not local and log_path.is_file():
                              with log_path.open(errors="replace") as log:
                                  node = next((line[6:].strip() for line in islice(log, 3)
                                               if line.startswith("host: ")), "")
                          node = node.split(".", 1)[0]
                          if name in already_done:
                              progress(logging.INFO, "%s is State.FINISHED, skipping", labels[name])
                              finished.add(name)
                          elif node:
                              progress(logging.INFO, "Started %s on %s", labels[name], node)
                          assigned[name] = (node, started_at)
                          if len(assigned) == len(names):
                              progress(logging.INFO, "All checkpoints assigned, waiting for completion...")
                      if (done or failed) and name not in finished:
                          node, started_at = assigned[name]
                          where = f" \ton {node}" if node else ""
                          if done:
                              duration = ""
                              if started_at is not None:
                                  elapsed = time.gmtime(max(0, completed.stat().st_mtime - started_at))
                                  duration = " \tin " + time.strftime("%Hh %Mm %Ss", elapsed)
                              progress(logging.INFO, "%s succeeded%s%s", labels[name], where, duration)
                          else:
                              progress(logging.ERROR, "%s failed%s (log: %s)", labels[name], where, work / "log.txt")
                              failed_count += 1
                          finished.add(name)
                  remaining = len(names) - len(finished)
                  if len(assigned) == len(names) and 0 < remaining <= 5 and remaining != last_remaining:
                      progress(logging.INFO, "Remaining checkpoints: %s",
                               ", ".join(labels[name] for name in names if name not in finished))
                      last_remaining = remaining
                  if status is not None:
                      break
                  try:
                      proc.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      pass
          if names and len(finished) == len(names):
              progress(logging.INFO, "All checkpoints completed")
          if status and status != 75:
              progress(logging.ERROR, "Launcher exits with code %d (log: %s)", status, launcher_log.resolve())
          sys.exit(status if status >= 0 else 128 - status)
          PY
          }

          run_local_parallel() {
            if [[ -n "$TRACE_FORMAT" ]]; then
              run_sim bash "$GEM5_HOME/util/xs_scripts/trace/parallel_trace_sim.sh" \
                "$CONFIG_PATH" "$CHECKPOINT_LIST" "$CHECKPOINT_ROOT_NODE" \
                spec_all "$SPECIFIC_BENCHMARKS_INPUT" "$extra_args"
            else
              if [[ "$CHECKPOINT_PROGRESS" != true ]]; then
                echo "Using local parallel_sim.sh runner"
              fi
              run_sim bash "$GEM5_HOME/util/xs_scripts/parallel_sim.sh" "$(realpath "$CONFIG_PATH")" \
                "$CHECKPOINT_LIST" \
                "$CHECKPOINT_ROOT_NODE" \
                spec_all \
                "$SPECIFIC_BENCHMARKS_INPUT" \
                "$extra_args"
            fi
          }

          distributed_servers="$DISTRIBUTED_SERVERS"
          if [ -n "$distributed_servers" ]; then
            if [[ "$CHECKPOINT_PROGRESS" != true ]]; then
              echo "Using distributed gem5 runner on servers: $distributed_servers"
            fi
            distributed_status=0
            run_sim python3 "$GEM5_HOME/util/xs_scripts/distributed_sim.py" \
              --servers "$distributed_servers" \
              --jobs-per-server "$DISTRIBUTED_JOBS_PER_SERVER" \
              --require-idle-cpus "$DISTRIBUTED_REQUIRE_IDLE_CPUS" \
              --idle-probe-mode "$DISTRIBUTED_IDLE_PROBE_MODE" \
              --launch-retries 3 \
              --launch-retry-delay 30 \
              --launch-interval 0.5 \
              --ssh-option StrictHostKeyChecking=accept-new \
              --ssh-option UserKnownHostsFile="$PERF_ARCHIVE_DIR/known_hosts" \
              --ssh-option ConnectTimeout=10 \
              --build-type "$GEM5_BUILD_TYPE" \
              "${trace_args[@]}" \
              "$(realpath "$CONFIG_PATH")" \
              "$CHECKPOINT_LIST" \
              "$CHECKPOINT_ROOT_NODE" \
              spec_all \
              "$SPECIFIC_BENCHMARKS_INPUT" \
              "$extra_args" || distributed_status=$?

            if [ "$distributed_status" -eq 75 ]; then
              echo "::warning title=Distributed servers unavailable::Falling back to local parallel_sim.sh"
              run_local_parallel
            elif [ "$distributed_status" -ne 0 ]; then
              exit "$distributed_status"
            fi
          else
            run_local_parallel
          fi
      # SPEC scoring applies only to checkpoint suites.
      - name: Setup gem5_data_proc environment
        if: ${{ steps.config.outputs.trace_format == '' }}
        run: |
          # 使用本地数据处理仓库，避免GitHub网络问题
          cd $GITHUB_WORKSPACE
          cp -r /nfs/home/share/gem5_ci/gem5_data_proc .
      - name: Check performance test result
        if: ${{ steps.config.outputs.trace_format == '' }}
        env:
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
        run: |
          # 添加yanyue的 Python 包路径, 包含pandas等
          export PYTHONPATH=$GITHUB_WORKSPACE/gem5_data_proc:/nfs/home/yanyue/.local/lib/python3.12/site-packages:$PYTHONPATH
          # 每次run 会进入新的shell, 需要重新设置GEM5_HOME
          export GEM5_HOME=$GITHUB_WORKSPACE

          cd $GITHUB_WORKSPACE/gem5_data_proc
          CLUSTER_CONFIG="$PERF_ARCHIVE_DIR/cluster.json"
          if [[ "$CLUSTER_CONFIG" != /* ]]; then
            CLUSTER_CONFIG="$GEM5_HOME/$CLUSTER_CONFIG"
          fi
          # 使用已有的数据spec_all生成测试报告
          bash example-scripts/${{ steps.config.outputs.score_script }} \
            "$PERF_ARCHIVE_DIR/spec_all" \
            "$CLUSTER_CONFIG" \
            > $GITHUB_WORKSPACE/score.txt
          cp "$GITHUB_WORKSPACE/score.txt" "$PERF_ARCHIVE_DIR/"
          # 提取最后42行score信息
          echo "### performance test result :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 42 $GITHUB_WORKSPACE/score.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # 提取关键指标
          FINAL_SCORE=$(grep "Estimated Int score per GHz:" $GITHUB_WORKSPACE/score.txt | awk '{print $NF}')
          echo "### Key indicators" >> $GITHUB_STEP_SUMMARY
          echo "- Final Int score per GHz: **${FINAL_SCORE}**" >> $GITHUB_STEP_SUMMARY

          # 最后检查是否存在abort文件， 如果存在，打出前10个错误名字
          ABORT_COUNT=$(find "$PERF_ARCHIVE_DIR/spec_all" -type f -name "abort" | wc -l)
          if [ "$ABORT_COUNT" -gt 0 ]; then
            echo "### :x: Test Failures Detected!" >> $GITHUB_STEP_SUMMARY
            echo "Failed test count: $ABORT_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "First 10 failed tests:" >> $GITHUB_STEP_SUMMARY
            find "$PERF_ARCHIVE_DIR/spec_all" -type f -name "abort" |
              sed 's|.*/\([^/]*\)/abort|\1|' |
              head -n 10 |
              while read -r line; do
                echo "- $line" >> $GITHUB_STEP_SUMMARY
              done
              if [ "${{ inputs.check_result }}" == "true" ]; then
                exit 1
              fi
          fi
      # Trace reports reuse score.txt and the existing archive/upload steps.
      - name: Check trace performance results
        if: ${{ !cancelled() && steps.config.outputs.trace_format != '' && steps.archive.outputs.target_dir != '' }}
        env:
          BENCHMARK_TYPE: ${{ steps.config.outputs.benchmark_type }}
          PERF_ARCHIVE_DIR: ${{ steps.archive.outputs.target_dir }}
        run: |
          status=0
          python3 util/xs_scripts/perf_benchmarks.py "$BENCHMARK_TYPE" \
            --output-dir "$PERF_ARCHIVE_DIR" \
            --trace-results "$PERF_ARCHIVE_DIR/spec_all" \
            > "$GITHUB_WORKSPACE/score.txt" || status=$?
          cp "$GITHUB_WORKSPACE/score.txt" "$PERF_ARCHIVE_DIR/"
          {
            echo '### Trace performance test result'
            echo '```'
            cat "$GITHUB_WORKSPACE/score.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Archive performance data
        if: ${{ always() && steps.archive.outputs.target_dir != '' }}
        run: |
          BENCHMARK_DIR="${{ steps.archive.outputs.benchmark_dir }}"
          TARGET_DIR="${{ steps.archive.outputs.target_dir }}"

          echo "Performance data already written to $TARGET_DIR"
          
          # Also save score.txt for quick reference
          if [ -f "$GITHUB_WORKSPACE/score.txt" ]; then
            cp "$GITHUB_WORKSPACE/score.txt" "$TARGET_DIR/"
          fi
          
          # Auto cleanup: keep only last 200 runs for this benchmark type
          if [ -d "$BENCHMARK_DIR" ] && [ $(ls -1 "$BENCHMARK_DIR" 2>/dev/null | wc -l) -gt 200 ]; then
            echo "Cleaning up old performance data, keeping last 200 runs"
            # Use absolute paths to avoid accidental deletion if cd fails
            ls -1t "$BENCHMARK_DIR" | tail -n +201 | while read -r old_run; do
              if [ -n "$old_run" ] && [ -d "$BENCHMARK_DIR/$old_run" ]; then
                rm -rf "$BENCHMARK_DIR/$old_run"
                echo "Deleted: $BENCHMARK_DIR/$old_run"
              fi
            done
            echo "Cleanup completed"
          fi
          
          echo "Performance data archived successfully"
          ARCHIVE_SIZE=$(du -sh "$TARGET_DIR/spec_all" 2>/dev/null | cut -f1 || echo "missing")
          echo "Archive size: ${ARCHIVE_SIZE}"
          {
            echo "### Archive output"
            echo "- Path: \`$TARGET_DIR\`"
            echo "- Size: ${ARCHIVE_SIZE}"
          } >> $GITHUB_STEP_SUMMARY
      - name: Upload score artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: score.txt
          if-no-files-found: warn
          retention-days: 30
