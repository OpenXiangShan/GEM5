name: gem5 Performance Test Template (Unified)

on:
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
        description: "gem5 config file path relative to the repository root"
      extra_args:
        required: false
        type: string
        default: ""
        description: "Extra arguments for the gem5 config"
      benchmark_type:
        required: true
        type: string
        description: "Benchmark profile from util/ci/perf_benchmarks.json"
      specific_benchmarks:
        required: false
        type: string
        default: ""
        description: "Comma-separated benchmark filters"
      vector_type:
        required: false
        type: string
        default: ""
        description: "Vector decode strategy: empty, base, or simple"
      check_result:
        required: false
        type: boolean
        default: true
        description: "Fail when a checkpoint writes an abort marker"
      pr_sha:
        required: false
        type: string
        description: "Commit SHA, branch, or tag to checkout"
      timeout_minutes:
        required: false
        type: number
        default: 360
        description: "Job timeout in minutes"
      distributed_servers:
        required: false
        type: string
        default: ""
        description: "Server list, default pool, or empty for local execution"
      distributed_jobs_per_server:
        required: false
        type: number
        default: 32
        description: "Maximum concurrent gem5 jobs per distributed server"

permissions:
  contents: read

jobs:
  run_performance_test:
    runs-on: [self-hosted, node]
    timeout-minutes: ${{ inputs.timeout_minutes }}
    continue-on-error: false
    name: XS-GEM5 - Run performance test (${{ inputs.benchmark_type }})
    steps:
      - name: Reject untrusted PR head checkout
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing to checkout an external fork PR head under pull_request_target."
          exit 1

      - name: Checkout CI control code
        uses: actions/checkout@v7
        with:
          path: ci-control
          persist-credentials: false

      - name: Checkout tested gem5 revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          path: gem5-src
          persist-credentials: false

      - name: Prepare performance run
        id: prepare
        env:
          CONFIG_PATH_INPUT: ${{ inputs.config_path }}
          BENCHMARK_TYPE_INPUT: ${{ inputs.benchmark_type }}
          SPECIFIC_BENCHMARKS_INPUT: ${{ inputs.specific_benchmarks }}
          EXTRA_ARGS_INPUT: ${{ inputs.extra_args }}
          DISTRIBUTED_SERVERS_INPUT: ${{ inputs.distributed_servers }}
          DISTRIBUTED_JOBS_PER_SERVER_INPUT: ${{ inputs.distributed_jobs_per_server }}
        run: |
          python3 "$GITHUB_WORKSPACE/ci-control/util/ci/perf_ci.py" \
            --repo-root "$GITHUB_WORKSPACE/gem5-src" prepare \
            --config-path="$CONFIG_PATH_INPUT" \
            --benchmark-type="$BENCHMARK_TYPE_INPUT" \
            --specific-benchmarks="$SPECIFIC_BENCHMARKS_INPUT" \
            --extra-args="$EXTRA_ARGS_INPUT" \
            --distributed-servers="$DISTRIBUTED_SERVERS_INPUT" \
            --distributed-jobs-per-server="$DISTRIBUTED_JOBS_PER_SERVER_INPUT" \
            --archive-root=/nfs/home/share/gem5_ci/performance_data \
            --run-number="$GITHUB_RUN_NUMBER" \
            --run-id="$GITHUB_RUN_ID" \
            --github-ref="$GITHUB_REF"

      - uses: ./ci-control/.github/actions/build-dramsim
        with:
          gem5-root: ${{ github.workspace }}/gem5-src

      - name: Build GEM5 fast
        env:
          VECTOR_TYPE_INPUT: ${{ inputs.vector_type }}
        run: |
          python3 "$GITHUB_WORKSPACE/ci-control/util/ci/perf_ci.py" \
            --repo-root "$GITHUB_WORKSPACE/gem5-src" build \
            --manifest="${{ steps.prepare.outputs.manifest }}" \
            --vector-type="$VECTOR_TYPE_INPUT"

      - name: Run performance test
        run: |
          python3 "$GITHUB_WORKSPACE/ci-control/util/ci/perf_ci.py" \
            --repo-root "$GITHUB_WORKSPACE/gem5-src" run \
            --manifest="${{ steps.prepare.outputs.manifest }}"

      - name: Score and check performance result
        run: |
          python3 "$GITHUB_WORKSPACE/ci-control/util/ci/perf_ci.py" \
            --repo-root "$GITHUB_WORKSPACE/gem5-src" score \
            --manifest="${{ steps.prepare.outputs.manifest }}" \
            --check-result="${{ inputs.check_result }}"

      - name: Finalize performance archive
        if: ${{ always() && steps.prepare.outputs.manifest != '' }}
        run: |
          python3 "$GITHUB_WORKSPACE/ci-control/util/ci/perf_ci.py" \
            --repo-root "$GITHUB_WORKSPACE/gem5-src" finalize \
            --manifest="${{ steps.prepare.outputs.manifest }}"

      - name: Upload score artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ steps.prepare.outputs.target_dir }}/score.txt
            ${{ steps.prepare.outputs.target_dir }}/score-error.log
            ${{ steps.prepare.outputs.target_dir }}/h_score
          if-no-files-found: warn
          retention-days: 30
