<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0d1b2a; }
      .subtitle { font: 22px Arial, sans-serif; fill: #607083; }
      .panel-title { font: 700 28px Arial, sans-serif; fill: #0d1b2a; }
      .panel-sub { font: 17px Arial, sans-serif; fill: #607083; }
      .tile { fill: #f8fafc; stroke: #b7c4d4; stroke-width: 2; rx: 12; }
      .tile-rn { fill: #eef6ff; stroke: #2f73b7; stroke-width: 3; rx: 12; }
      .tile-hn { fill: #fff7e7; stroke: #d88900; stroke-width: 3; rx: 12; }
      .tile-dram { fill: #fffdf0; stroke: #d88900; stroke-width: 3; rx: 12; }
      .tile-shadow { fill: #f2efff; stroke: #7056c8; stroke-width: 3; rx: 12; }
      .tile-mixed { fill: #fff3d8; stroke: #d88900; stroke-width: 3; rx: 12; }
      .mesh-label { font: 700 16px Arial, sans-serif; fill: #263447; }
      .port { font: 12px Consolas, monospace; fill: #607083; }
      .badge-text { font: 700 15px Arial, sans-serif; fill: white; }
      .legend { font: 17px Arial, sans-serif; fill: #415063; }
      .note { font: 15px Arial, sans-serif; fill: #607083; }
      .badge-r { fill: #2f73b7; }
      .badge-h { fill: #d88900; }
      .badge-d { fill: #e8a400; }
      .badge-s { fill: #7056c8; }
      .badge-lite { opacity: 0.18; }
    </style>
  </defs>
  <rect width="1900" height="1100" fill="#ffffff"/>
  <text x="46" y="60" class="title">xsCHI Topology Attachment Layout</text>
  <text x="46" y="94" class="subtitle">5x3 and 6x6 mesh endpoint placement for RN, HN, DRAM/SN, and ShadowRN</text>
  <line x1="46" y1="126" x2="1854" y2="126" stroke="#d9e1ec" stroke-width="2"/>

  <g transform="translate(58 154)">
    <circle cx="0" cy="0" r="13" class="badge-r"/><text x="0" y="5" text-anchor="middle" class="badge-text">R</text><text x="24" y="6" class="legend">main RN</text>
    <circle cx="160" cy="0" r="13" class="badge-h"/><text x="160" y="5" text-anchor="middle" class="badge-text">H</text><text x="184" y="6" class="legend">HN / CHI_L3</text>
    <circle cx="365" cy="0" r="13" class="badge-d"/><text x="365" y="5" text-anchor="middle" class="badge-text">D</text><text x="389" y="6" class="legend">DRAM / SN</text>
    <circle cx="560" cy="0" r="13" class="badge-s"/><text x="560" y="5" text-anchor="middle" class="badge-text">S</text><text x="584" y="6" class="legend">ShadowRN</text>
    <text x="795" y="6" class="legend">badges show local0/local1 endpoint use</text>
  </g>

